name: Feature Request
description: Suggest an idea or enhancement for FogSense Device Runtime
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please search existing issues and discussions first to make sure this hasn't already been suggested.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution or Behavior
      description: A clear and concise description of what you want to happen or how the feature should behave.
    validations:
      required: true
  - type: textarea
    id: spec-contract-impact
    attributes:
      label: Impact on Device Spec or Contract
      description: Does this introduce new YAML spec fields, new state properties, new API routes, or change existing behavior?
      placeholder: "e.g. Adds a new optional field 'debounce_ms' to sensor definitions..."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.

