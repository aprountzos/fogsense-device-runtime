name: CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/**'
      - 'cmd/**'
      - 'contract/**'
      - 'examples/**'
      - 'Dockerfile'
      - 'docker-compose.example.yml'
      - 'docker-compose.mqtt.example.yml'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'pkg/**'
      - 'cmd/**'
      - 'contract/**'
      - 'examples/**'
      - 'Dockerfile'
      - 'docker-compose.example.yml'
      - 'docker-compose.mqtt.example.yml'
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  test-go:
    name: Test Go Runtime
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ['1.22', '1.23', '1.24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Go tests
        run: go test -v ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

      - name: Build all binaries
        run: |
          go build -o fogsense-device-runtime .
          go build -o fogsense-mock-gateway ./cmd/mock-gateway
          go build -o fogsense-mock-mqtt-gateway ./cmd/mock-mqtt-gateway


  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build -t fogsense-device-runtime:ci .

      - name: Run MQTT playground integration test
        run: |
          docker compose -f docker-compose.mqtt.example.yml up --build -d
          for attempt in $(seq 1 30); do
            logs="$(docker compose -f docker-compose.mqtt.example.yml logs mqtt-light mqtt-sensor mqtt-gateway mqtt-broker)"
            if echo "$logs" | grep -q "/telemetry"; then
              break
            fi
            sleep 2
          done
          echo "$logs"
          echo "$logs" | grep -q "registered with gateway"
          echo "$logs" | grep -q "/telemetry"

          docker compose -f docker-compose.mqtt.example.yml exec -T mqtt-broker \
            mosquitto_pub -h localhost \
            -t fogsense/v1/devices/mqtt-light-1/commands \
            -m '{"commandId":"ci-command-1","name":"TURN_ON"}'

          sleep 3
          logs="$(docker compose -f docker-compose.mqtt.example.yml logs mqtt-light mqtt-gateway)"
          echo "$logs"
          echo "$logs" | grep -q "/commands/ack"

      - name: Stop MQTT playground
        if: always()
        run: docker compose -f docker-compose.mqtt.example.yml down -v

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install documentation dependencies
        run: npm ci
        working-directory: ./docs

      - name: Build Docusaurus site
        run: npm run build
        working-directory: ./docs
