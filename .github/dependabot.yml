
version: 2

updates:
  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Athens
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions

  # Docusaurus dependencies
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    time: "09:00"
    timezone: Europe/Athens
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - npm

  # Go dependencies
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Athens
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
