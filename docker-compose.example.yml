# Local playground: a mock gateway + two devices.
#
#   docker compose -f docker-compose.example.yml up --build
#
# The mock gateway prints every registration and message it receives:
#   docker compose -f docker-compose.example.yml logs -f mock-gateway
#
# The device ports are published so you can talk to a device from your machine.
# The devices run with DEVICE_TOKEN=demo-token, so their API needs the header:
#
#   bash:        curl -H "X-Device-Token: demo-token" http://localhost:8080/info
#   PowerShell:  curl.exe -H "X-Device-Token: demo-token" http://localhost:8080/info
#
# (In PowerShell plain `curl` is an alias of Invoke-WebRequest; use curl.exe or Invoke-RestMethod.)

services:
  mock-gateway:
    build: .
    entrypoint: ["fogsense-mock-gateway"]
    command: ["--port", "8081", "--device-token", "demo-token"]
    ports:
      - "8081:8081"

  light-1:
    build: .
    depends_on: [mock-gateway]
    environment:
      DEVICE_ID: light-1
      GATEWAY_URL: http://mock-gateway:8081
      DEVICE_TOKEN: demo-token
      ADVERTISE_URL: http://light-1:8080
      DEVICE_SPEC_FILE: /config/spec.yaml
    volumes:
      - ./examples/smart-light.yaml:/config/spec.yaml:ro
    ports:
      - "8080:8080"

  sensor-1:
    build: .
    depends_on: [mock-gateway]
    environment:
      DEVICE_ID: sensor-1
      GATEWAY_URL: http://mock-gateway:8081
      DEVICE_TOKEN: demo-token
      ADVERTISE_URL: http://sensor-1:8080
      DEVICE_SPEC_FILE: /config/spec.yaml
      TIME_SCALE: "2"
    volumes:
      - ./examples/temp-sensor.yaml:/config/spec.yaml:ro
    ports:
      - "8082:8080"