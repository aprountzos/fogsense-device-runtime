# Secure local MQTT playground overlay.
# Prepare ./secrets/mosquitto/{certs,passwd,acl} before starting.
# Create password entries with mosquitto_passwd; never commit the passwd file.
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto-secure.conf"]
    ports:
      - "8883:8883"
    volumes:
      - ./examples/mosquitto-secure.conf:/mosquitto/config/mosquitto-secure.conf:ro
      - ./secrets/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./secrets/mosquitto/acl:/mosquitto/config/acl:ro
      - ./secrets/mosquitto/certs:/mosquitto/certs:ro
      - ./secrets/mosquitto/certs:/mosquitto/config/certs:ro
      - mqtt-secure-data:/mosquitto/data

  mqtt-gateway:
    build: .
    entrypoint: ["fogsense-mock-mqtt-gateway"]
    command: ["--broker-url", "mqtts://mqtt-broker:8883", "--username", "fogsense-mock-gateway", "--password", "${MQTT_GATEWAY_PASSWORD:?set MQTT_GATEWAY_PASSWORD}", "--ca-file", "/mosquitto/certs/ca.crt", "--dedupe-file", "/data/dedupe.json"]
    depends_on: [mqtt-broker]
    volumes:
      - mqtt-secure-gateway-data:/data
      - ./secrets/mosquitto/certs:/mosquitto/certs:ro
      - ./secrets/mosquitto/client:/mosquitto/client:ro
    environment:
      MQTT_GATEWAY_CLIENT_CERT_FILE: ${MQTT_GATEWAY_CLIENT_CERT_FILE:-}
      MQTT_GATEWAY_CLIENT_KEY_FILE: ${MQTT_GATEWAY_CLIENT_KEY_FILE:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mqtt-light:
    build: .
    depends_on: [mqtt-broker]
    environment:
      DEVICE_ID: mqtt-light-1
      GATEWAY_TRANSPORT: mqtt
      MQTT_BROKER_URL: mqtts://mqtt-broker:8883
      MQTT_CA_FILE: /mosquitto/certs/ca.crt
      MQTT_CLIENT_CERT_FILE: ${MQTT_LIGHT_CLIENT_CERT_FILE:-}
      MQTT_CLIENT_KEY_FILE: ${MQTT_LIGHT_CLIENT_KEY_FILE:-}
      MQTT_USERNAME: mqtt-light-1
      MQTT_PASSWORD: ${MQTT_LIGHT_PASSWORD:?set MQTT_LIGHT_PASSWORD}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      ADVERTISE_URL: http://mqtt-light:8080
      DEVICE_SPEC_FILE: /config/spec.yaml
      OUTBOX_PATH: /data/outbox.json
    volumes:
      - ./examples/smart-light.yaml:/config/spec.yaml:ro
      - ./secrets/mosquitto/certs:/mosquitto/certs:ro
      - ./secrets/mosquitto/client:/mosquitto/client:ro
      - mqtt-light-secure-outbox:/data

  mqtt-sensor:
    build: .
    depends_on: [mqtt-broker]
    environment:
      DEVICE_ID: mqtt-sensor-1
      GATEWAY_TRANSPORT: mqtt
      MQTT_BROKER_URL: mqtts://mqtt-broker:8883
      MQTT_CA_FILE: /mosquitto/certs/ca.crt
      MQTT_CLIENT_CERT_FILE: ${MQTT_SENSOR_CLIENT_CERT_FILE:-}
      MQTT_CLIENT_KEY_FILE: ${MQTT_SENSOR_CLIENT_KEY_FILE:-}
      MQTT_USERNAME: mqtt-sensor-1
      MQTT_PASSWORD: ${MQTT_SENSOR_PASSWORD:?set MQTT_SENSOR_PASSWORD}
      ADVERTISE_URL: http://mqtt-sensor:8080
      DEVICE_SPEC_FILE: /config/spec.yaml
      OUTBOX_PATH: /data/outbox.json
    volumes:
      - ./examples/temp-sensor.yaml:/config/spec.yaml:ro
      - ./secrets/mosquitto/certs:/mosquitto/certs:ro
      - ./secrets/mosquitto/client:/mosquitto/client:ro
      - mqtt-sensor-secure-outbox:/data

volumes:
  mqtt-secure-data:
  mqtt-light-secure-outbox:
  mqtt-sensor-secure-outbox:
  mqtt-secure-gateway-data:
