<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Dark rounded canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#0b1120" />

  <!-- Microchip body -->
  <rect x="92" y="92" width="72" height="72" rx="12" fill="url(#chip)" />

  <!-- Chip pins — top -->
  <line x1="112" y1="92" x2="112" y2="74" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="144" y1="92" x2="144" y2="74" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Chip pins — bottom -->
  <line x1="112" y1="164" x2="112" y2="182" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="144" y1="164" x2="144" y2="182" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Chip pins — left -->
  <line x1="92" y1="112" x2="74" y2="112" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="92" y1="144" x2="74" y2="144" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Chip pins — right -->
  <line x1="164" y1="112" x2="182" y2="112" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="164" y1="144" x2="182" y2="144" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Signal wave arcs (top-right, radiating outward) -->
  <path d="M 172 84 A 28 28 0 0 1 200 56" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <path d="M 180 76 A 44 44 0 0 1 216 40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4" />
</svg>